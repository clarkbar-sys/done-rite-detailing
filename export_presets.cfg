; Export presets. The editor rewrites this file when you touch the Export
; dialog, so keep hand-edits minimal and review the diff.
;
; `make build` exports the "Linux" preset and `make build-web` the "Web" one,
; both headlessly. `embed_pck=true` makes the Linux result a single
; self-contained executable, which is what we publish; the web bundle is
; necessarily a directory of files (see the Web preset's own notes below).
;
; exclude_filter is comma-separated glob, matched against the res:// path with
; the prefix stripped, and `*` crosses directory separators — so `tests/*`
; covers tests/unit/ and tests/integration/ without listing either. Verified by
; exporting a .pck both ways: with the filter, zero res://tests/ entries; with
; it removed, four (the two scripts and their .remap sidecars).
;
; addons/gut/* is the test framework itself. GUT is fetched by `make gut` and
; only ever runs from the CLI, but export_filter="all_resources" packs whatever
; is on disk — verified: without this entry a developer who had run the tests
; shipped ~250 GUT scripts inside the game, and CI (which runs the tests before
; the export) shipped them every single time.
;
; include_filter carries the two font licences, and it is a licensing
; requirement rather than tidiness. The game ships two typefaces under the SIL
; Open Font Licence (see src/core/brand.gd), and the OFL asks that the copyright
; notice and the licence travel with the font in any distribution. What travels
; is the pack: a .ttf becomes a res:// resource and is packed by
; export_filter="all_resources", but a .txt beside it is not a resource, has no
; importer, and would simply not be there — the same fact the Web preset's notes
; below establish about web/shell.html, in the one place where it costs
; something. Eight kilobytes, in both presets, because both are published.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/brand/fonts/*.txt"
exclude_filter="tests/*, addons/gut/*, release-please-config.json"
export_path="build/linux/done-rite-detailing.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@host_ip"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="#!/usr/bin/env bash
export DISPLAY=:0
unzip -o -q \"{temp_dir}/{archive_name}\" -d \"{temp_dir}\"
\"{temp_dir}/{exe_name}\" {cmd_args}"
ssh_remote_deploy/cleanup_script="#!/usr/bin/env bash
kill $(pgrep -x -f \"{temp_dir}/{exe_name} {cmd_args}\")
rm -rf \"{temp_dir}\""

; ---------------------------------------------------------------------------
; Web — what GitHub Pages serves and what a release ships as a .zip.
;
; export_path ends in `index.html` and that name is load-bearing twice over.
; Godot names every emitted file after the .html you export to (the template
; zip's `godot.*` entries are renamed to `<basename>.*` on extraction), so this
; produces the nine files index.html / index.js / index.wasm / index.pck /
; index.png / index.icon.png / index.apple-touch-icon.png and the two
; index.audio*.worklet.js. And a static host has to be handed an `index.html`
; to serve a bare directory URL — anything else means the "playable from a
; link" link needs a filename in it.
;
; exclude_filter REPEATS the Linux preset's entries rather than inheriting them,
; because there is no inheritance: each preset filters independently, and a web
; bundle is the build most people will actually run. Checked on every run
; rather than once: ci-godot.yml's `build-web` job greps the exported index.pck
; for `res://(tests|addons/gut)/` and fails the job on a hit.
;
; variant/thread_support=false — THE COOP/COEP DECISION, and the reason
; scripts/fetch-godot.sh keeps `web_nothreads_*` rather than `web_*`.
; A threaded Godot web build needs SharedArrayBuffer, which browsers only expose
; to a cross-origin-isolated page, which needs the server to send
; Cross-Origin-Opener-Policy: same-origin and Cross-Origin-Embedder-Policy:
; require-corp. GitHub Pages sends neither and offers no way to configure
; headers. With threads on, godot.js's own getMissingFeatures() would then
; refuse to boot with "Cross-Origin Isolation - Check that the web server
; configuration sends the correct headers." — read in the 4.7.1 template, where
; that check is wrapped in `if (supportsThreads)` and so is simply skipped by
; the nothreads build. STANDARDS.md "Distribution" records the alternatives
; (a header-capable host, or the service-worker shim below) and why neither won.
;
; progressive_web_app/enabled=false, so
; progressive_web_app/ensure_cross_origin_isolation_headers is inert — it is
; left at its engine default rather than flipped to false, because it is the
; setting a future reader will reach for and its default is the sane one if the
; PWA is ever turned on. That pair is the shim Godot ships for the header
; problem: with the PWA on, godot.service.worker.js intercepts fetches and adds
; the two headers itself (`ensureCrossOriginIsolationHeaders()` in the template
; source). It is not used here because it only isolates the page after the
; worker is installed AND the page reloads, and because a service worker caches
; the previous build — directly at odds with "the link always shows current
; main". Verified in platform/web/export/export_plugin.cpp: with pwa=false the
; exporter skips `godot.service.worker.js` and `godot.offline.html` entirely,
; so the bundle below has neither file and no cache layer at all.
;
; html/export_icon=true emits index.icon.png + index.apple-touch-icon.png from
; the project icon — a favicon for a page whose whole job is being linked to.
;
; html/custom_html_shell=res://web/shell.html — the loading screen, and the
; only branded thing a player sees before the engine has started at all. It is
; Godot's own full-size.html with the start menu's lockup on it: the logo in a
; Brand.card(), the project name under it, and a red bar where the Start pill
; goes. Two things are worth knowing before touching this line.
;
; FIRST, emptying it is a silent downgrade. The exporter falls back to the
; stock template shell — grey bar, Godot's logo, no error and no warning — so
; a bundle built without this still boots and still looks wrong. The shell is
; vendored rather than patched because there is no hook: the exporter reads
; one HTML file and substitutes its `$GODOT_*` placeholders, so the copy is
; the only way in. web/shell.html's own header says what was changed and what
; to diff against on a Godot bump.
;
; SECOND, the file does not end up in the pack, and that is checked rather
; than assumed: export_filter="all_resources" packs *resources*, and an .html
; is not one — Godot's filesystem scan has no importer for it, so it never
; becomes a res:// resource to pack. Verified by reading a fresh index.pck:
; zero `res://web/` strings. That is why it is not in exclude_filter; adding
; it there would imply a risk that does not exist and would go stale quietly.

[preset.1]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/brand/fonts/*.txt"
exclude_filter="tests/*, addons/gut/*, release-please-config.json"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://web/shell.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
threads/emscripten_pool_size=8
threads/godot_pool_size=4
