<!DOCTYPE html>
<!--
	The page a player waits on.

	This is Godot's own web shell — misc/dist/html/full-size.html at
	4.7.1-stable, the version scripts/fetch-godot.sh pins — with the brand put
	on it. It is wired in by `html/custom_html_shell` in export_presets.cfg,
	and if that line is ever emptied the export silently falls back to the
	stock grey one.

	WHY A COPY AND NOT A PATCH. There is no hook: the exporter reads one HTML
	file, substitutes its `$GODOT_*` placeholders and writes the result. So the
	whole file is vendored, which means it can drift from upstream. The defence
	is that the <script> below is byte-identical to 4.7.1's — every change is
	in the markup and the CSS above it — so bumping Godot is `diff` against the
	new full-size.html, and only this comment, the <style> and the <body>
	markup should ever conflict.

	THE PLACEHOLDERS ARE LOAD-BEARING. The GODOT_URL, GODOT_CONFIG and
	GODOT_THREADS_ENABLED tokens below — each spelled with a leading `$` where
	it actually appears — are what make this a game rather than a page; drop
	one and the bundle boots to a blank canvas with a console error nobody
	sees. tests/unit/test_web_shell.gd asserts all of them are still here,
	because a missing placeholder cannot fail a type check, a smoke run or an
	export — it only fails in a browser.

	Which is also why this comment writes them bare. Substitution is a plain
	string replace over every line of the file, comments included, so a `$`
	spelled here is a `$` the exporter fills in: an earlier draft of this
	paragraph shipped the entire GODOT_CONFIG JSON blob inside the comment on
	the published page. Prose about a placeholder has to avoid the sigil.

	WHAT THE PLAYER SEES, AND WHY IT IS THE START MENU'S LOCKUP. Card, then
	name, then a red pill: the order Done Rite's site introduces itself in and
	the order src/screens/title_screen.tscn repeats. The loading screen is the
	first of the three a player meets, so it is the same lockup with the pill
	turned into a progress bar — the wait becomes part of the sequence instead
	of a grey interruption before it.

	THE COLOURS ARE COPIED, AND THAT IS THE ONE UNAVOIDABLE DUPLICATION.
	src/core/brand.gd is the single source of truth for every value below, and
	CSS in a file the engine never loads cannot read a GDScript constant. Each
	one is commented with the `Brand` member it mirrors so a palette change is
	a grep for the hex rather than a hunt. The *logo* is not duplicated: it is
	`application/boot_splash/image` in project.godot, which the exporter writes
	out beside index.html and substitutes into `index.png` — so this file
	names no asset and the picture has exactly one home, assets/brand/.
-->
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Done Rite Detailing</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* The overlay covers the canvas and is removed outright once the game starts.

   Upstream positions the splash image and the progress bar absolutely too,
   independently of each other; here they are laid out by the column below, so
   only the overlay itself needs taking out of flow.

   `#09090b` is `application/boot_splash/bg_color`, which
   project.godot sets to Brand.INK — so the page the lockup is printed on is
   the site's black, not the engine's grey, and the native boot splash that
   follows this screen is the same colour. */
#status {
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	bottom: 0;
	background-color: #09090b;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

/* The lockup: card, name, bar, in that order and centred as one block.
   Upstream positions the splash and the bar absolutely and independently
   (image filling the overlay, bar pinned at `bottom: 10%`); stacking them in
   a flex column instead is what puts the bar *under the logo* rather than
   somewhere else on the screen. */
#status-lockup {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 12px;
	/* Matches the 380 px logo on the title screen, and gives way on a phone
	   — where this design renders at roughly a third scale. */
	width: min(380px, 62vw);
}

/* Brand.card(): PANEL, CARD_RADIUS, LINE, CARD_INSET and the drop shadow.
   The logo is artwork on its own black background, so on a black page it
   reads as nothing at all without a lit edge around it — the same reason
   the title screen puts it in a PanelContainer. */
#status-card {
	box-sizing: border-box;
	width: 100%;
	background-color: #141418; /* Brand.PANEL */
	border: 1px solid rgba(255, 255, 255, 0.09); /* Brand.LINE */
	border-radius: 30px; /* Brand.CARD_RADIUS */
	padding: 12px; /* Brand.CARD_INSET */
	box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45); /* Brand.CARD_SHADOW_* */
}

#status-splash {
	display: block;
	width: 100%;
	height: auto;
	/* Sits inside a 30 px corner with 12 px of inset, so the artwork's own
	   corner is the difference between the two. */
	border-radius: 18px;
}

#status-splash.show-image--false {
	display: none;
}

/* `fullsize--true` is upstream's "stretch the splash over the whole page",
   which is not a thing a card can contain — the card is the size, so the
   class is neutralised rather than honoured. `:has()` keeps the frame honest
   if anyone turns the image off in project.godot: an empty lit card would
   read as a missing asset, which is exactly what it would be. */
#status-splash.fullsize--true {
	height: auto;
	width: 100%;
	object-fit: contain;
}

#status-card:has(> .show-image--false) {
	display: none;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

/* Brand.MUTED under the wordmark, the same demotion the title screen's
   subtitle is: the logo has already said the name loudly once. */
#status-name {
	margin: 0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 1.25rem;
	color: #b9b9c1; /* Brand.MUTED */
}

#status-progress, #status-notice {
	display: none;
}

/* The pill, as a bar. Brand.pill(RED, 20) is a 20 px control with a 10 px
   corner and the red glow under it, and that is what this is — the same shape
   the player is about to press Start on.

   `appearance: none` is what makes a <progress> styleable at all; without it
   the track and the fill stay the platform's. */
#status-progress {
	width: 100%;
	height: 20px;
	appearance: none;
	-webkit-appearance: none;
	border: none;
	border-radius: 10px;
	/* Firefox paints the track as the element's own background; Chrome and
	   Safari paint ::-webkit-progress-bar over it. Both are set, so the track
	   is PANEL in every browser. */
	background-color: #141418; /* Brand.PANEL */
	box-shadow: 0 12px 30px rgba(226, 27, 35, 0.26); /* Brand.PILL_SHADOW_* */
}

#status-progress::-webkit-progress-bar {
	background-color: #141418; /* Brand.PANEL */
	border-radius: 10px;
}

#status-progress::-webkit-progress-value {
	background-color: #e21b23; /* Brand.RED */
	border-radius: 10px;
}

#status-progress::-moz-progress-bar {
	background-color: #e21b23; /* Brand.RED */
	border-radius: 10px;
}

/* THE INDETERMINATE CASE. The script below drops `value` and `max` whenever
   the engine reports a total of 0, and a styled <progress> in that state
   paints an empty track and sits there — a bar that looks broken rather than
   one that admits it cannot count. So when there is no value the fill becomes
   a band swept across the track: motion that says "still working" without
   claiming a fraction it does not know.

   HOW OFTEN THAT HAPPENS, READ RATHER THAN ASSUMED. Not on every gzipped
   response, which is the obvious guess and is wrong here: index.js never
   looks at Content-Length at all. `loadFetch` seeds each file's total from
   `GODOT_CONFIG.fileSizes` (`total: fileSize || 0`), and the exporter bakes
   the byte counts of index.wasm and index.pck into that object — so the two
   files this bundle downloads both have a size before the first request goes
   out, and the bar is normally determinate. A total of 0 needs a tracked file
   the exporter listed no size for, and `animateProgress` zeroes the whole
   total when any one file is missing one. Godot's own API docs for
   EngineConfig.onProgress state the callback can be handed 0 "when it is
   impossible to calculate", so this is the documented contract's fallback
   rather than a case anyone should expect to see on Pages. It stays because
   it costs eight lines and the failure it prevents is invisible in testing —
   nobody exercises it until the day the bundle gains a third file. */
#status-progress:not([value]) {
	background-image: linear-gradient(
		90deg,
		rgba(226, 27, 35, 0) 0%,
		#e21b23 40%,
		#e21b23 60%,
		rgba(226, 27, 35, 0) 100%
	);
	background-repeat: no-repeat;
	background-size: 45% 100%;
	animation: status-sweep 1.4s ease-in-out infinite;
}

/* The pseudo-element track would otherwise paint over the sweep. */
#status-progress:not([value])::-webkit-progress-bar {
	background-color: transparent;
}

#status-progress:not([value])::-moz-progress-bar {
	background-color: transparent;
}

@keyframes status-sweep {
	from { background-position: -50% 0; }
	to { background-position: 150% 0; }
}

/* A loading bar is the one animation on screen, so it is also the one that
   cannot be opted out of entirely — motion is the only thing distinguishing
   "downloading" from "hung". Reduced to a still band in the middle of the
   track: present, red, and not moving. */
@media (prefers-reduced-motion: reduce) {
	#status-progress:not([value]) {
		animation: none;
		background-position: 50% 0;
	}
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="status-lockup">
				<div id="status-card">
					<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
				</div>
				<p id="status-name">Done Rite Detailing</p>
				<progress id="status-progress"></progress>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":771180,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
