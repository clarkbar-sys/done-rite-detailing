name: CI (Godot)

# Six jobs, fastest feedback first:
#   lint      — gdformat --check + gdlint every script (pure Python, no Godot download)
#   check     — type-check every script + boot the game headless (editor only, ~76 MB)
#   test      — the test map check, then the GUT unit + integration suites, headless
#   build     — export the Linux release binary, run it, upload it as an artifact
#   build-web — export the web bundle, budget its gzip download size, upload
#               it, and deploy a live PR preview
#   pages     — publish that bundle to GitHub Pages; `main` only
#
# GitHub Pages is one repo-global site, so `main`'s deploy and a PR's preview
# can't both be the "github-pages" Actions deployment — only one deployment can
# hold that environment at a time, and a PR must never be the one holding it.
# Both now instead push to the `gh-pages` branch: `pages` writes the site root,
# `build-web` writes a PR's bundle under `pr-preview/pr-<number>/` (rossjrw/
# pr-preview-action), and `pages-preview-cleanup.yml` deletes that subfolder
# when the PR closes. Repo setting this depends on, done once by hand: Settings
# -> Pages -> Build and deployment -> Source = "Deploy from a branch" ->
# `gh-pages` / `(root)`.
#
# `lint` doesn't `need:` anything and runs in parallel with `check` — it has no
# Godot dependency, so gating it behind the ~76 MB editor download would only
# slow down the signal it exists to give quickly.
#
# `test` is its own job rather than a step inside `check`, even though both need
# the same editor download and the same import pass. Two reasons, both about the
# signal rather than the seconds: a red PR check reading "Unit & integration
# tests" says something different from one reading "Type check & smoke", and the
# two can be required independently in branch protection. Between them the two
# jobs run exactly what `make test` runs locally — `check` takes the first two
# targets, `test` the last two.
#
# There is no coverage job. GDScript has no line-coverage instrumentation this
# project is willing to gate on; `make tested` is what stands in its place, and
# it runs as the first step of `test`. STANDARDS.md "Coverage" has the numbers.
#
# `build-web` is split from `build` rather than bolted onto it. They export the
# same project from the same SDK cache, but they fail for different reasons —
# a missing web template, a preset filter, a renderer the browser can't take —
# and "Export web bundle" going red while "Export Linux build" stays green is
# the whole signal. It also keeps `pages` waiting on one short job instead of
# on the Linux export and its boot check.
#
# check/test/build/build-web use the pinned toolchain from scripts/fetch-godot.sh,
# so CI and a developer's `make` run the identical Godot. The SDK is cached on
# that script's hash: bumping the pin invalidates the cache automatically.
# `lint` uses the version pin in requirements-dev.txt the same way, and the GUT
# addon is cached on scripts/fetch-gut.sh's hash for the same reason.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-godot-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACT: build/linux/done-rite-detailing.x86_64
  WEB_DIR: build/web

  # THE ONE PLACE THE WEB BUNDLE'S SIZE BUDGET LIVES. #209: the 35 MB pck grew
  # in a handful of art PRs (#140, #152, #164, #168) with no CI signal at all —
  # 16 MB of it was one duplicated texture nobody saw land. `build-web`'s
  # "Bundle size" step below gates on this number so the next one fails loudly
  # instead of shipping quietly.
  #
  # It is a GZIP total, not a raw one, because gzip is what GitHub Pages'
  # `actions-gh-pages` deploy actually serves and a raw byte is not what a
  # player's browser downloads. Measured with the exact command the step below
  # runs (`gzip -c <file> | wc -c` per file in build/web/, summed) against a
  # clean `make build-web`. When this budget was first set, on 2026-08-09 and
  # before any of the load-time siblings had landed, that was:
  #
  #   index.pck   35,615,884 B raw -> 35,088,688 B gzip
  #   index.wasm  39,513,091 B raw -> 10,142,310 B gzip
  #   bundle total (every file in build/web/, gzip)     45,581,247 B
  #
  # It exists to catch GROWTH, not to bless today's size, so it is ratcheted
  # down as those land rather than left with headroom nobody is using. After
  # #213/#215/#212 and #205 (the texture import pass) it was:
  #
  #   index.pck    5,636,516 B raw ->  5,236,783 B gzip
  #   index.wasm  39,513,091 B raw -> 10,142,310 B gzip
  #   bundle total (every file in build/web/, gzip)     15,729,342 B
  #
  # ...at which point the engine's own .wasm was 64% of the total and the next
  # real cut was not an art one. #208 made it: the bundle is now built on a
  # template this project compiles, with the modules the game never touches
  # left out (web/build_profile.json, and the `web-template` job below).
  #
  #   index.pck    5,652,008 B raw ->  5,223,232 B gzip
  #   index.wasm  28,141,460 B raw ->  6,815,150 B gzip
  #   bundle total (every file in build/web/, gzip)     12,382,560 B
  #
  # 12,800,000 is that 12,382,560 plus ~417 KB (~3%) of headroom — enough that
  # a rebuild's changing build_stamp.json (commit + timestamp, always the same
  # length) can't flip it, not enough to absorb a real art drop.
  #
  # It now gates two things rather than one, and the second is the reason
  # export_presets.cfg's custom_template/release can be trusted. A bundle built
  # against the STOCK template is ~3.3 MB heavier than this number allows, so
  # emptying that setting — or restoring a stale template — fails here instead
  # of quietly shipping the engine this project stopped shipping.
  WEB_GZIP_BUDGET_BYTES: 12800000

jobs:
  lint:
    name: Format & lint (gdtoolkit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No Godot involved — gdformat/gdlint are pure-Python source checks —
      # so pin the interpreter instead of trusting whatever ubuntu-latest
      # ships, same "reproducible, not ambient" reasoning as the Godot pin.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # gdformat --check + gdlint over every tracked script; non-zero on any
      # formatting diff or rule violation. See requirements-dev.txt for the
      # gdtoolkit version pin and .gdlintrc for the rule set.
      - name: gdformat --check + gdlint
        run: make lint

  check:
    name: Type check & smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Editor only — `check` and `smoke` never touch the export templates.
      - name: Cache Godot editor
        uses: actions/cache@v6
        with:
          path: .godot-sdk/bin
          key: godot-editor-${{ hashFiles('scripts/fetch-godot.sh') }}

      # Everything under tests/ extends GutTest, and `check` type-checks every
      # .gd in the tree — so this job needs the addon on disk even though it
      # never runs a test. See the Makefile's `import` target.
      - name: Cache GUT
        uses: actions/cache@v6
        with:
          path: addons/gut
          key: gut-${{ hashFiles('scripts/fetch-gut.sh') }}

      # Fails on any untyped/unsafe GDScript (project.godot promotes those
      # warnings to errors) and on any error logged during a headless boot.
      # Not `make test`: that would also run the suites this workflow's `test`
      # job runs, for no extra signal.
      - name: Type check & headless smoke test
        run: make check smoke

  test:
    name: Unit & integration tests (GUT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Before the caches on purpose: this is grep over the checkout, it needs
      # neither Godot nor GUT, and it is the gate that replaces the line
      # coverage floor this project decided not to have (STANDARDS.md
      # "Coverage"). Failing it in two seconds beats failing it after a 76 MB
      # download. See scripts/check-test-map.sh for the three rules.
      - name: Every src/ script is reached by a test
        run: make tested

      - name: Cache Godot editor
        uses: actions/cache@v6
        with:
          path: .godot-sdk/bin
          key: godot-editor-${{ hashFiles('scripts/fetch-godot.sh') }}

      # The addon is pinned by commit + tree sha256 in scripts/fetch-gut.sh and
      # gitignored, so it is fetched, not checked out. Keyed on that script so a
      # version bump re-clones instead of serving the old cache.
      - name: Cache GUT
        uses: actions/cache@v6
        with:
          path: addons/gut
          key: gut-${{ hashFiles('scripts/fetch-gut.sh') }}

      # `make gut` does NOT trust GUT's exit code on its own. GUT 9.7.1 exits 0
      # when it collects no test scripts at all — a deleted tests/ directory, a
      # renamed file, a bad -gdir — and prints "Nothing was run." on its way
      # out, and it exits 0 for a test that asserts nothing too ("risky"). The
      # recipe therefore checks the run summary as well, the same way `make
      # smoke` checks its log rather than believing Godot's exit status.
      # See the Makefile's `gut` target for the verification behind both.
      - name: GUT suites
        run: make gut

      # The log is the evidence when a test fails on a runner and not locally.
      # `if: always()` so it survives the step above going red — which is the
      # only time anyone wants it.
      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gut-log
          path: build/logs/gut.log
          if-no-files-found: warn

  build:
    name: Export Linux build
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Editor + the pruned export templates (~280 MB).
      - name: Cache Godot SDK
        uses: actions/cache@v6
        with:
          path: .godot-sdk
          key: godot-sdk-${{ hashFiles('scripts/fetch-godot.sh') }}

      # `make export-linux` runs the import pass, and the import pass scans
      # tests/, every file of which extends GutTest — so the addon has to be on
      # disk here even though this job neither type-checks nor runs a test. It
      # is excluded from the export itself (export_presets.cfg): it is here to
      # make the import possible, not to ship.
      - name: Cache GUT
        uses: actions/cache@v6
        with:
          path: addons/gut
          key: gut-${{ hashFiles('scripts/fetch-gut.sh') }}

      # Stamp the branch head, not the synthetic refs/pull/N/merge commit a PR
      # build checks out — the merge commit isn't a SHA anyone can find in the
      # branch's history. On push/dispatch there's no PR, so github.sha is right.
      #
      # `export-linux` rather than `build`: `build` type-checks first, and this
      # job already `need:`s the `check` job that did exactly that on exactly
      # this commit. See the Makefile's note — it was 65s of this job's 76s.
      - name: Export
        env:
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: make export-linux

      # The export succeeding is not the same as the game working. Boot the
      # actual artifact — this is the "I can see the build run" gate.
      #
      # `shell: bash` is load-bearing: the default shell for a `run:` step is
      # `bash -e` *without* pipefail, so `binary | tee` would report tee's exit
      # status and a crashed game would pass this step silently.
      - name: Run the exported game
        shell: bash
        run: |
          "$ARTIFACT" --headless --quit-after 120 2>&1 | tee run.log
          if grep -qE '(^|[[:space:]])(SCRIPT |USER )?ERROR:' run.log; then
            echo "::error::the exported binary logged errors on startup"
            exit 1
          fi

      - name: Summarise
        run: |
          {
            echo "### Linux build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Size | $(du -h "$ARTIFACT" | cut -f1) |"
            echo "| Commit | \`$(jq -r .commit build_stamp.json)\` |"
            echo "| Built | $(jq -r .built_at build_stamp.json) |"
            echo
            echo '```'
            grep -a 'Done Rite Detailing' run.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Downloadable from the run page / the PR's checks tab.
      - name: Upload the game
        uses: actions/upload-artifact@v7
        with:
          name: done-rite-detailing-linux-x86_64
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  # The engine the web bundle is built from, which this project compiles itself
  # — see web/build_profile.json for what is left out and scripts/
  # build-web-template.sh for how. It is a job rather than a step because it is
  # the one thing here that can take an hour, and because "Web export template"
  # going red says something completely different from "Export web bundle"
  # going red.
  #
  # It almost never takes an hour. The cache key is the build id
  # scripts/fetch-web-template.sh computes — the hash of the profile plus the
  # two scripts that decide what goes into it — so a hit is every run that did
  # not change one of those three files, which is very nearly every run. A miss
  # is a deliberate change to what the engine contains, and paying a full
  # compile for that is the correct price rather than an unfortunate one.
  #
  # The cache does not evict this out from under us: GitHub drops a cache after
  # seven days without a read, and this one is read by every push and every PR.
  #
  # Deliberately NOT `needs: [check, test]`. It compiles C++ and knows nothing
  # about the GDScript those jobs check, so making it wait would add its
  # runtime to the critical path on exactly the runs where it has work to do.
  web-template:
    name: Web export template
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # The id is a hash of three files, computed by the script that also
      # enforces it — read here rather than re-derived with hashFiles(), so the
      # cache key and the staleness check can never disagree about what a
      # template is made of.
      - name: The template's build id
        id: build-id
        run: echo "id=$(scripts/fetch-web-template.sh --print-id)" >> "$GITHUB_OUTPUT"

      - name: Cache the web export template
        uses: actions/cache@v6
        with:
          path: |
            .godot-sdk/web_nothreads_release.zip
            .godot-sdk/web_nothreads_release.zip.build-id
          key: web-template-${{ steps.build-id.outputs.id }}

      # SCons is the build system; emscripten is fetched and pinned by
      # build-web-template.sh itself, the same way the Godot SDK is. Both steps
      # are cheap and unconditional — the expensive part is the compile below,
      # which the script skips on its own when the cache restored a template
      # whose build id still matches.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install SCons
        run: pip install scons

      - name: Build the template if the cache missed
        run: scripts/fetch-web-template.sh .godot-sdk/web_nothreads_release.zip

      - name: Summarise
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          unzip -oq .godot-sdk/web_nothreads_release.zip godot.wasm -d "$tmp"
          {
            echo "### Web export template"
            echo
            echo "| | |"
            echo "|---|---:|"
            echo "| \`godot.wasm\` raw | $(stat -c%s "$tmp/godot.wasm") B |"
            echo "| \`godot.wasm\` gzip | $(gzip -c "$tmp/godot.wasm" | wc -c) B |"
            echo "| sha256 | \`$(sha256sum .godot-sdk/web_nothreads_release.zip | cut -d' ' -f1)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # `build-web` takes it from here rather than restoring the same cache, so
      # what the bundle is built from is provably the file this job produced.
      - name: Upload the template
        uses: actions/upload-artifact@v7
        with:
          name: web-export-template
          path: .godot-sdk/web_nothreads_release.zip
          if-no-files-found: error
          retention-days: 1

  build-web:
    name: Export web bundle
    needs: [check, test, web-template]
    runs-on: ubuntu-latest

    # The workflow-wide grant is `contents: read`; a job-level block REPLACES
    # it. `contents: write` is the PR-preview step below pushing to the
    # `gh-pages` branch — the same permission `pages` uses to write the site
    # root, just scoped to the `pr-preview/` subfolder instead. `pull-requests:
    # write` is that step's sticky preview-link comment.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      # Same cache as `build` — one SDK, keyed on the fetch script, and that
      # script now also unpacks the web_nothreads_* templates. Bumping it
      # invalidates both jobs' caches together, which is the point.
      - name: Cache Godot SDK
        uses: actions/cache@v6
        with:
          path: .godot-sdk
          key: godot-sdk-${{ hashFiles('scripts/fetch-godot.sh') }}

      # `make export-web` runs the import pass, and that pass scans tests/,
      # which extends GutTest. The addon is excluded from the bundle itself
      # (export_presets.cfg) — see the identical note on `build`.
      - name: Cache GUT
        uses: actions/cache@v6
        with:
          path: addons/gut
          key: gut-${{ hashFiles('scripts/fetch-gut.sh') }}

      # The engine, from the job above. export_presets.cfg's Web preset names
      # this exact path in custom_template/release and the export stops without
      # it — see that file, and STANDARDS.md "The engine itself".
      #
      # Downloaded rather than restored from the same cache, for the reason
      # `pages` downloads this job's bundle instead of re-exporting: what the
      # game is built on is then provably the file `web-template` measured,
      # not a second copy that happened to share a key.
      - name: Download the web export template
        uses: actions/download-artifact@v8
        with:
          name: web-export-template
          path: .godot-sdk

      # The build id `web-template` computed is written beside the template by
      # the fetch script, and the artifact does not carry it — so write it here
      # rather than let `export-web`'s dependency decide the file is stale and
      # start a 50-minute compile inside the export job.
      - name: Mark it current
        run: scripts/fetch-web-template.sh --print-id > .godot-sdk/web_nothreads_release.zip.build-id

      # Stamped exactly like the Linux export: the branch head, not the
      # synthetic merge commit — see the note on `build`. The web build prints
      # the same `v<version> (<sha>)` line to the browser console that the
      # Linux binary prints to stdout, so the stamp is how you tell which
      # commit the page you are looking at was built from.
      #
      # `export-web` rather than `build-web`, for the reason `build` uses
      # `export-linux` — the `check` job it `need:`s already type-checked this
      # commit. See the Makefile's note.
      - name: Export
        env:
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: make export-web

      # The web pack is a separate preset with its own exclude_filter, and
      # nothing makes the two presets agree — so check the bundle rather than
      # trusting that someone kept them in step. This is the gate that would
      # have caught GUT being packed into every Linux build (see
      # export_presets.cfg); it costs one grep.
      - name: The bundle ships no tests and no GUT
        shell: bash
        run: |
          if strings -a "$WEB_DIR/index.pck" | grep -qE 'res://(tests|addons/gut)/'; then
            echo "::error::tests/ or addons/gut/ leaked into the web pack"
            strings -a "$WEB_DIR/index.pck" | grep -E 'res://(tests|addons/gut)/' | head
            exit 1
          fi
          echo "no res://tests/ or res://addons/gut/ entries in index.pck"

      # #209: the number that would have caught #140/#152/#164/#168 landing a
      # duplicated 16 MB texture with no signal anywhere. Per-file raw and
      # gzip sizes for the whole bundle, gzip because that is what
      # `actions-gh-pages` in the `pages` job below actually serves — then a
      # hard fail if the gzip total is over WEB_GZIP_BUDGET_BYTES, the one
      # knob for this, defined with its evidence in this workflow's `env:`
      # block above.
      #
      # `gzip -c`, not `gzip -9 -c`: this is the command WEB_GZIP_BUDGET_BYTES
      # was measured with (see the comment on it), and `-9` reads smaller —
      # measured on this bundle, 45,522,379 B at `-9` against 45,581,247 B at
      # the default level. Budget and measurement have to agree on the knob or
      # the number this step prints means nothing.
      - name: "Bundle size (gzip is what Pages serves), budgeted"
        shell: bash
        run: |
          human() { numfmt --to=iec --suffix=B --format="%.2f" "$1"; }

          total_raw=0
          total_gzip=0
          rows=""
          for f in "$WEB_DIR"/*; do
            [ -f "$f" ] || continue
            raw=$(stat -c%s "$f")
            gzip_size=$(gzip -c "$f" | wc -c)
            total_raw=$((total_raw + raw))
            total_gzip=$((total_gzip + gzip_size))
            rows="${rows}| \`$(basename "$f")\` | $(human "$raw") | $(human "$gzip_size") |"$'\n'
          done

          {
            echo "### Web bundle size"
            echo
            echo "Gzip is what GitHub Pages actually serves (see \`pages\` below) — that"
            echo "column and the total under it are what \`WEB_GZIP_BUDGET_BYTES\`"
            echo "($(human "$WEB_GZIP_BUDGET_BYTES") / $WEB_GZIP_BUDGET_BYTES B), set in this"
            echo "workflow's \`env:\` block, gates."
            echo
            echo "| File | Raw | Gzip |"
            echo "|---|---:|---:|"
            printf '%s' "$rows"
            echo "| **Total** | **$(human "$total_raw")** | **$(human "$total_gzip")** |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "raw total ${total_raw} B, gzip total ${total_gzip} B, budget ${WEB_GZIP_BUDGET_BYTES} B"

          # The ten largest entries inside index.pck — not a gate, a pointer at
          # what to cut. Never fails this step: a top-ten list is a nicety on
          # top of the size that was already measured and gated above, not a
          # second thing this job asserts. See scripts/pck-top-ten.gd for why
          # it has to run from an empty directory to see only the pack.
          probe_dir="$(mktemp -d)"
          if (cd "$probe_dir" && "$GITHUB_WORKSPACE/.godot-sdk/bin/godot" --headless \
                --script "$GITHUB_WORKSPACE/scripts/pck-top-ten.gd" -- \
                "$GITHUB_WORKSPACE/$WEB_DIR/index.pck") > "$probe_dir/top_ten.log" 2>&1; then
            {
              echo
              echo "<details><summary>index.pck's ten largest entries</summary>"
              echo
              echo '```'
              grep -v '^Godot Engine' "$probe_dir/top_ten.log"
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::scripts/pck-top-ten.gd didn't run cleanly — skipping the top-ten list (non-fatal, see the job log)"
            cat "$probe_dir/top_ten.log"
          fi

          if [ "$total_gzip" -gt "$WEB_GZIP_BUDGET_BYTES" ]; then
            echo "::error::web bundle gzip total is ${total_gzip} B, over the ${WEB_GZIP_BUDGET_BYTES} B WEB_GZIP_BUDGET_BYTES budget (ci-godot.yml env: block) — trim the bundle, or if the growth is deliberate raise that knob with a measured reason"
            exit 1
          fi
          echo "web bundle gzip total is within budget"

      # Downloadable from the run page / the PR's checks tab, same as `build`'s
      # Linux binary. `pages` (main) downloads this same artifact rather than
      # re-exporting, so it and the PR preview below are provably the bundle
      # this job just checked.
      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: done-rite-detailing-web
          path: ${{ env.WEB_DIR }}
          if-no-files-found: error

      # Live preview for a PR: pushes $WEB_DIR to gh-pages under
      # pr-preview/pr-<number>/ and drops/updates a sticky comment with the
      # link (rossjrw/pr-preview-action posts it). `action: deploy` rather than
      # the default `auto` because this job never runs on a `closed` PR event
      # in the first place — cleanup on close is pages-preview-cleanup.yml,
      # which doesn't need a build at all.
      - name: Deploy the PR preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ${{ env.WEB_DIR }}
          action: deploy

  pages:
    name: Publish to GitHub Pages
    needs: build-web
    # `main` only. A PR must not be able to overwrite the published game — its
    # bundle goes to a `pr-preview/` subfolder instead (see `build-web`).
    # workflow_dispatch on main is allowed through so the page can be
    # re-published without an empty commit.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # The workflow-wide grant is `contents: read`; a job-level block REPLACES
    # it. `contents: write` is this job pushing the site root to `gh-pages`.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # Same artifact `build-web` just uploaded — downloaded rather than
      # re-exported, so what gets published is provably the bundle that ran
      # the "no tests, no GUT" check, not a fresh export of the same commit.
      - name: Download the web bundle
        uses: actions/download-artifact@v8
        with:
          name: done-rite-detailing-web
          path: ${{ env.WEB_DIR }}

      # Pushes $WEB_DIR to the root of `gh-pages`. `keep_files: true` is
      # load-bearing: without it this deploy wipes the whole branch first,
      # taking every PR's live pr-preview/pr-<number>/ subfolder with it. No
      # Jekyll (the action writes .nojekyll itself) — the bundle is served
      # exactly as built, which is what a .wasm/.pck needs.
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.WEB_DIR }}
          publish_branch: gh-pages
          keep_files: true

      - name: Summarise
        run: |
          echo "### Playable at https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
