name: Release

# release-please keeps a "Release PR" that bumps the version and updates
# CHANGELOG.md from Conventional Commits. Merging that PR tags the release; this
# same run then exports the game — the Linux binary and the web bundle — and
# attaches both to the GitHub Release.
#
# The web bundle is attached here as a zip, and also published live to
# GitHub Pages under releases/<tag>/ (and mirrored to releases/latest/) —
# in addition to ci-godot.yml's continuous publish of `main` to the Pages
# root. All three answer different questions: the Pages root is always
# whatever `main` is right now, releases/<tag>/ is a permanent URL for the
# version someone can still link to in a year, and the zip is what they'd
# download to run offline. Same `gh-pages` branch, same `keep_files: true`
# contract as ci-godot.yml's `pages` job — see the note there for why.
#
# The bump also rewrites `config/version` in project.godot (see the
# `x-release-please-version` marker there), so the version the game prints at
# startup is the version on the tag — not a number someone forgot to update.
#
# The build runs in *this* workflow rather than reacting to the `release` event,
# because releases created with GITHUB_TOKEN don't trigger other workflows.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  WEB_DIR: build/web

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  artifacts:
    name: Build & attach the game
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tag carries the bumped project.godot, so check it out rather than
      # main — otherwise the release binary reports the pre-bump version.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Cache Godot SDK
        uses: actions/cache@v6
        with:
          path: .godot-sdk
          key: godot-sdk-${{ hashFiles('scripts/fetch-godot.sh') }}

      # Both distribution channels, from the one checkout of the tag, so the
      # binary and the web bundle on a release are provably the same commit.
      - name: Export
        run: make build build-web

      # `shell: bash` is load-bearing — see the note in ci-godot.yml: the default
      # `run:` shell has no pipefail, so a crashed binary would pass this step.
      - name: Verify the release binary boots
        shell: bash
        run: |
          ./build/linux/done-rite-detailing.x86_64 --headless --quit-after 120 2>&1 | tee run.log
          if grep -qE '(^|[[:space:]])(SCRIPT |USER )?ERROR:' run.log; then
            echo "::error::the release binary logged errors on startup"
            exit 1
          fi

      # There is no equivalent boot check for the web bundle here: running it
      # needs a browser, and CI's `build-web` job already gated this commit on
      # the export succeeding and on tests/ and GUT staying out of the pack.
      # What is checked is that the archive is not a lie — it must contain the
      # entry the whole thing exists for.
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          out="done-rite-detailing-${TAG}-linux-x86_64"
          cp build/linux/done-rite-detailing.x86_64 "$out"

          # Zipped, not loose: a web build is nine files that only work
          # together, and `gh release upload` takes files. Zipped from inside
          # build/ so the archive root is `web/` — `-j` would flatten it and
          # scatter index.* over whatever directory someone unzipped into — and
          # from a subshell with an absolute destination so nothing is moved
          # into the project directory, which Godot would scan (see the
          # Makefile's build/.gdignore).
          web="$PWD/done-rite-detailing-${TAG}-web.zip"
          ( cd build && zip -qr "$web" web )
          unzip -l "$web" | grep -q 'web/index.html' \
            || { echo "::error::$web has no web/index.html"; exit 1; }

          gh release upload "$TAG" "$out" "$web" --clobber

      # Same $WEB_DIR the zip above was made from, published live under its own
      # permanent subfolder rather than overwriting the Pages root — ci-godot.yml's
      # `pages` job owns the root (`main`, continuously). Two pushes, not one, so a
      # bad link that hardcodes "latest" and a permanent per-version link both
      # work; `keep_files: true` on both means neither wipes the other, the root,
      # or any live `pr-preview/` folder.
      - name: Publish to GitHub Pages (releases/<tag>)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.WEB_DIR }}
          publish_branch: gh-pages
          destination_dir: releases/${{ needs.release-please.outputs.tag_name }}
          keep_files: true

      - name: Publish to GitHub Pages (releases/latest)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.WEB_DIR }}
          publish_branch: gh-pages
          destination_dir: releases/latest
          keep_files: true

      - name: Summarise
        run: |
          echo "Playable at https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/releases/${{ needs.release-please.outputs.tag_name }}/" >> "$GITHUB_STEP_SUMMARY"
