name: Release

# release-please keeps a "Release PR" that bumps the version and updates
# CHANGELOG.md from Conventional Commits. Merging that PR tags the release; this
# same run then exports the game and attaches it to the GitHub Release.
#
# The bump also rewrites `config/version` in project.godot (see the
# `x-release-please-version` marker there), so the version the game prints at
# startup is the version on the tag — not a number someone forgot to update.
#
# The build runs in *this* workflow rather than reacting to the `release` event,
# because releases created with GITHUB_TOKEN don't trigger other workflows.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  artifacts:
    name: Build & attach the game
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tag carries the bumped project.godot, so check it out rather than
      # main — otherwise the release binary reports the pre-bump version.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Cache Godot SDK
        uses: actions/cache@v4
        with:
          path: .godot-sdk
          key: godot-sdk-${{ hashFiles('scripts/fetch-godot.sh') }}

      - name: Export
        run: make build

      - name: Verify the release binary boots
        run: |
          ./build/linux/done-rite-detailing.x86_64 --headless --quit-after 120 2>&1 | tee run.log
          if grep -qE '(^|[[:space:]])(SCRIPT |USER )?ERROR:' run.log; then
            echo "::error::the release binary logged errors on startup"
            exit 1
          fi

      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          out="done-rite-detailing-${TAG}-linux-x86_64"
          cp build/linux/done-rite-detailing.x86_64 "$out"
          gh release upload "$TAG" "$out" --clobber
